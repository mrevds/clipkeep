name: release
# Push a tag like v0.2.0: builds ready-made binaries for Linux, Windows and macOS and attaches them
# to a GitHub release. Asset names carry no version, so install.sh / install.ps1 can always fetch
# .../releases/latest/download/clipkeep-<target>.<ext>.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on an older Ubuntu so the binary also runs on older distributions (glibc 2.35+).
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64, exe: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, exe: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64, exe: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64, exe: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
        env:
          # The Google OAuth client baked into release binaries (Settings > Secrets > Actions).
          CLIPKEEP_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CLIPKEEP_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - name: Package
        shell: bash
        run: |
          d=clipkeep-${{ matrix.name }}
          mkdir "$d"
          for b in clipkeep clipkeepw; do cp "target/${{ matrix.target }}/release/$b${{ matrix.exe }}" "$d/"; done
          cp README.md LICENSE "$d/"
          if [ "${{ matrix.exe }}" = ".exe" ]; then 7z a "$d.zip" "$d"; else tar czf "$d.tar.gz" "$d"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: clipkeep-${{ matrix.name }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            install.sh
            install.ps1
