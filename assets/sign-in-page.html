<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>clipkeep</title>
<style>
:root{--beni:#B3202D;--night:#121013;--ink:#1A1716;--paper:#F4F1EC;--muted:#A39A93}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#2a1216 0%,var(--night) 62%);
 color:var(--paper);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;padding:16px}
main{width:100%;max-width:420px;text-align:center;padding:40px 32px 32px;background:rgba(26,23,22,.78);
 border:1px solid rgba(244,241,236,.09);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.logo{width:104px;height:104px;margin:0 auto 6px;display:block;color:var(--beni)}
.logo svg{width:100%;height:100%;display:block}
.badge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:10px 0 4px;
 background:@BADGE@;font-size:19px;font-weight:700;line-height:1}
h1{font-size:24px;margin:8px 0 6px;font-weight:650;letter-spacing:.2px}
p{margin:0;color:var(--muted)}
.foot{margin-top:26px;font-size:12.5px;color:#6f6762;letter-spacing:.3px}
</style></head><body><main>
<div class="logo"><svg xmlns="http://www.w3.org/2000/svg" color="#B3202D" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="29.5" stroke-width="2.6"/><g transform="translate(32 33) scale(.8) translate(-32 -34)">
  <path d="M32 58 C31 51 33 43 32 36" stroke-width="2.6"/>
  <g stroke-width="1.7">
    <path d="M32 36 C27 29 18 24 9 24"/><path d="M32 36 C28 26 22 17 15 12"/><path d="M32 36 C31 26 29 16 26 8"/>
    <path d="M32 36 C37 29 46 24 55 24"/><path d="M32 36 C36 26 42 17 49 12"/><path d="M32 36 C33 26 35 16 38 8"/>
  </g>
  <g stroke-width="2.6">
    <path d="M32 36 C26 36 21 39 20 44 C22 42 25 42 26 44"/><path d="M32 36 C38 36 43 39 44 44 C42 42 39 42 38 44"/>
    <path d="M32 36 C29 32 24 31 21 33 C23 33 25 34 25 36"/><path d="M32 36 C35 32 40 31 43 33 C41 33 39 34 39 36"/>
  </g>
  <g fill="currentColor" stroke="none" class="dots">
    <circle cx="32" cy="36" r="2.8" class="heart"/>
    <circle cx="9" cy="24" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="26" cy="8" r="1.7"/>
    <circle cx="55" cy="24" r="1.7"/><circle cx="49" cy="12" r="1.7"/><circle cx="38" cy="8" r="1.7"/>
  </g></g></svg></div>
<div class="badge">@MARK@</div>
<h1>@TITLE@</h1>
<p>@TEXT@</p>
<div class="foot">clipkeep &middot; encrypted clipboard sync</div>
</main></body></html>
