<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>clipkeep</title>
<style>
:root{--accent:#2FAE6B;--night:#0F1613;--ink:#18211D;--paper:#F1F7F2;--muted:#93A69B}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#163626 0%,var(--night) 62%);
 color:var(--paper);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;padding:16px}
main{width:100%;max-width:420px;text-align:center;padding:40px 32px 32px;background:rgba(24,33,29,.78);
 border:1px solid rgba(244,241,236,.09);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.logo{width:104px;height:104px;margin:0 auto 6px;display:block;}
.logo svg{width:100%;height:100%;display:block}
.badge{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;margin:10px 0 4px;
 background:@BADGE@;font-size:19px;font-weight:700;line-height:1}
h1{font-size:24px;margin:8px 0 6px;font-weight:650;letter-spacing:.2px}
p{margin:0;color:var(--muted)}
.foot{margin-top:26px;font-size:12.5px;color:#66786E;letter-spacing:.3px}
</style></head><body><main>
<div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173A2A"/><stop offset="1" stop-color="#0E2219"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#18965B"/><stop offset=".55" stop-color="#3DBE74"/><stop offset="1" stop-color="#9BE89F"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tile)"/>
  <path d="M12.5 51.5 C10.5 28.5 27 12.5 51.5 12.5 C53.5 36 37 52 12.5 51.5 Z" fill="url(#leaf)"/>
  <path d="M12.5 51.5 C10.5 28.5 27 12.5 51.5 12.5 L12.5 51.5 Z" fill="#FFFFFF" fill-opacity=".10"/>
  <g transform="translate(32.5 31.5) rotate(45)" fill="none" stroke="#F6FFF2" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.3 -7.5 V8.2 a3.2 3.2 0 0 1 -6.4 0 V-10.5 a5.4 5.4 0 0 1 10.8 0 V11 a7.5 7.5 0 0 1 -15 0 V-3"/>
  </g>
  <path d="M10 54 L15.5 48.5" stroke="#18965B" stroke-width="3.2" stroke-linecap="round"/>
</svg></div>
<div class="badge">@MARK@</div>
<h1>@TITLE@</h1>
<p>@TEXT@</p>
<div class="foot">clipkeep &middot; encrypted clipboard sync</div>
</main></body></html>
